<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Hero Section</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fustat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="video-container">
        <video id="bg-video-1" class="bg-video" muted playsinline>
            <source
                src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260329_050842_be71947f-f16e-4a14-810c-06e83d23ddb5.mp4"
                type="video/mp4">
        </video>
        <video id="bg-video-2" class="bg-video" muted playsinline>
            <source
                src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260329_050842_be71947f-f16e-4a14-810c-06e83d23ddb5.mp4"
                type="video/mp4">
        </video>
    </div>

    <div class="content-overlay">
        <nav class="navbar">
            <div class="nav-left">
                <a href="#" class="logo">Logoipsum</a>
            </div>
            <div class="nav-center">
                <a href="#" class="nav-item">Platform</a>
                <a href="#" class="nav-item">
                    Features
                    <svg class="icon-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 9l6 6 6-6" />
                    </svg>
                </a>
                <a href="#" class="nav-item">Projects</a>
                <a href="#" class="nav-item">Community</a>
                <a href="#" class="nav-item">Contact</a>
            </div>
            <div class="nav-right">
                <button class="btn-signup">Sign Up</button>
                <button class="btn-login">Log In</button>
            </div>
        </nav>

        <main class="hero-content">
            <div class="badge">
                <div class="badge-dark">
                    <svg class="icon-star" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                    </svg>
                    New
                </div>
                <div class="badge-light">
                    Discover what's possible
                </div>
            </div>

            <h1 class="main-title">Transform Data Quickly</h1>
            <p class="subtitle">Upload your information and get powerful insights right away. Work smarter and achieve
                goals effortlessly.</p>

            <div class="search-box">
                <div class="search-header">
                    <div class="credits-info">
                        <span>60/450 credits</span>
                        <button class="btn-upgrade">Upgrade</button>
                    </div>
                    <div class="ai-info">
                        <svg class="icon-ai" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83" />
                        </svg>
                        Powered by GPT-4o
                    </div>
                </div>

                <div class="search-input-area">
                    <input type="text" placeholder="Type question..." class="main-input">
                    <button class="btn-submit">
                        <svg class="icon-up" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 19V5M5 12l7-7 7 7" />
                        </svg>
                    </button>
                </div>

                <div class="search-footer">
                    <div class="action-buttons">
                        <button class="action-btn">
                            <svg class="icon-attach" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                            </svg>
                            Attach
                        </button>
                        <button class="action-btn">
                            <svg class="icon-voice" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8" />
                            </svg>
                            Voice
                        </button>
                        <button class="action-btn">
                            <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8" />
                                <path d="M21 21l-4.35-4.35" />
                            </svg>
                            Prompts
                        </button>
                    </div>
                    <div class="char-counter">
                        0/3,000
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
