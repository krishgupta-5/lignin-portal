services:
  # Backend Service (FastAPI)
  - type: web
    name: lignin-portal-backend
    env: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: lignin_predictor
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://lignin-portal-frontend.onrender.com" # You can update this once you know the exact frontend URL

  # Frontend Service (Vite + React)
  - type: web
    name: lignin-portal-frontend
    env: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: lignin-portal-backend
          envVarKey: RENDER_EXTERNAL_URL
